$schema: https://azuremlschemas.azureedge.net/latest/PipelineJob.schema.json
type: pipeline
name: cv_pipeline
display_name: CV Pipeline
experiment_name: cv_experiment
inputs:
  input_data:
    # Assuming the data will be provided when the pipeline is run
    # Alternatively, you can specify a default path here
jobs:
  validation_step:
    type: command
    component: azureml:cv_model_validate@latest
    inputs:
      input_dir: ${{parent.inputs.input_data}}
    outputs:
      output_dir: validation_output
  inference_step:
    type: command
    component: azureml:cv_model_inference@latest
    inputs:
      input_data_path: ${{jobs.validation_step.outputs.output_dir}}/validation_output.txt
    outputs:
      output_dir: inference_output
outputs:
  inference_results:
    value: ${{jobs.inference_step.outputs.output_dir}}