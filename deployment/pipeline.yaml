$schema: https://azuremlschemas.azureedge.net/latest/PipelineJob.schema.json
type: pipeline
name: cv_pipeline
display_name: CV Pipeline
version: 2

inputs:
  input_dir:
    type: uri_folder
    description: "Input data directory"

outputs:
  output_dir:
    type: uri_folder
    description: "Output data directory"

jobs:
  validation_step:
    type: command
    component: azureml:cv_model_validate@latest

  inference_step:
    type: command
    component: azureml:cv_model_inference@latest


