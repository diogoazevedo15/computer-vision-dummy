# deployment/pipeline.yaml
$schema: https://azuremlschemas.azureedge.net/latest/PipelineComponent.schema.json
type: pipeline
name: cv_pipeline
display_name: CV Pipeline
version: 7

# Component-level inputs
inputs:
  input_dir:
    type: uri_folder
    description: "Input data directory"

# Component-level outputs
outputs:
  output_dir:
    type: uri_folder
    description: "Output data directory"

jobs:
  validation_step:
    type: command
    component: azureml:cv_model_validate@latest
    inputs:
      input_dir: ${{ parent.inputs.input_dir }}
    outputs:
      output_dir:

  inference_step:
    type: command
    component: azureml:cv_model_inference@latest
    inputs:
      input_data_path: ${{ parent.jobs.validation_step.outputs.output_dir }}
    outputs:
      output_dir: ${{ parent.outputs.output_dir }}