$schema: https://azuremlschemas.azureedge.net/latest/PipelineComponent.schema.json
type: pipeline
name: cv_pipeline_updated
display_name: CV Pipeline Updated
version: 10

# Component-level inputs
inputs:
  input_dir:
    type: uri_folder
    description: "Input data directory"

# Component-level outputs
outputs:
  output_dir:
    type: uri_folder
    description: "Output data directory"

jobs:
  validation_step:
    type: command
    component: azureml:cv_model_validate@latest
    inputs:
      input_dir: ${{ parent.inputs.input_dir }}
    outputs:
      output_dir:  # Make sure this is specified if required

  inference_step:
    type: command
    component: azureml:cv_model_inference@latest
    inputs:
      input_dir: ${{ parent.jobs.validation_step.outputs.output_dir }}  # Link output to input
    outputs:
      output_dir: ${{ parent.outputs.output_dir }}