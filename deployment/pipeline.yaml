$schema: https://azuremlschemas.azureedge.net/latest/PipelineComponent.schema.json
type: pipeline
name: cv_pipeline_updated
display_name: CV Pipeline Updated
version: 35

# Component-level inputs
inputs:
  input_url:
    type: uri_folder
    description: "Input data url where the data will be downloaded from."

outputs:
  validation_output_url:
    type: uri_folder
  inference_output_url:
    type: uri_folder

jobs:
  validation_step:
    type: command
    component: azureml:cv_model_validate@latest
    inputs:
      input_url: ${{ parent.inputs.input_url }}
    outputs:
      output_url:  ${{ parent.outputs.validation_output_url }}

  inference_step:
    type: command
    component: azureml:cv_model_inference@latest
    inputs:
      input_url: ${{ parent.jobs.validation_step.outputs.output_url }}
    outputs:
      output_url:  ${{ parent.outputs.inference_output_url }}