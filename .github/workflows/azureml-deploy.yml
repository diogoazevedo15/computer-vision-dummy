name: Deploy Batch Endpoint and Pipeline on Merge to qua

on:
  push:
    branches: [ qua ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_WORKSPACE_NAME: ${{ secrets.AZURE_WORKSPACE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2
      
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Login to Azure via Service Principal
        run: |
          az login --service-principal \
            --username $AZURE_CLIENT_ID \
            --password $AZURE_CLIENT_SECRET \
            --tenant $AZURE_TENANT_ID
      
      - name: Set Azure subscription
        run: az account set --subscription $AZURE_SUBSCRIPTION_ID

      - name: Install Azure ML CLI extension
        run: az extension add -n ml --yes

      - name: Configure defaults
        run: az configure --defaults group=$AZURE_RESOURCE_GROUP workspace=$AZURE_WORKSPACE_NAME subscription=$AZURE_SUBSCRIPTION_ID

      # Create or update environments
      - name: Create or update validation environment
        run: az ml environment create --file deployment/env_validate.yaml

      - name: Create or update inference environment
        run: az ml environment create --file deployment/env_inference.yaml

      # Create or update components
      - name: Create or update validation component
        run: az ml component create --file deployment/config_validate.yaml

      - name: Create or update inference component
        run: az ml component create --file deployment/config_inference.yaml

      # Create or update pipeline
      - name: Create or update pipeline
        run: az ml component create --file deployment/pipeline.yaml

      # Create or update batch deployment
      - name: Create or update batch deployment
        run: az ml batch-deployment create --file deployment/batch_deployment.yaml

      # Update default deployment
      - name: Set default deployment
        run: az ml batch-endpoint update --name cv-batch-endpoint --set defaults.deployment_name=cv-batch-deployment